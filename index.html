<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار العلوم - الفصل الثالث (سادس ابتدائي) | بواسطة ضياء</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/emoji/96/test-tube-emoji.png">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --success: #10b981;
      --success-bg: #064e3b;
      --error: #ef4444;
      --error-bg: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: #818cf8;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .by-tag {
      color: #a7f3d0;
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background-color: #27272a;
      border: 2px solid var(--border-color);
      color: var(--text);
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: #3f3f46;
    }

    .option-btn.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #a7f3d0 !important;
    }

    .option-btn.wrong {
      background-color: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: #fecaca !important;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .reaction-emoji {
      font-size: 1.8rem;
      margin-top: 15px;
      min-height: 40px;
    }

    .rights {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .rights strong {
      color: var(--text);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة الترحيب -->
    <div id="welcome-screen">
      <h1>🧪 أبطال العلوم 🧪</h1>
      <div class="by-tag">✨ بواسطة ضياء ✨</div>
      <p>أهلاً بك في اختبار العلوم التفاعلي - <strong>سادس ابتدائي (الفصل الثالث)</strong>!<br>هل أنت جاهز لتحدي أسئلة الفصل الثالث؟</p>
      <button class="btn" onclick="startQuiz()">ابدأ اختبار الفصل الثالث</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="quiz-screen" class="hidden">
      <h2 id="question-text" style="margin-bottom: 20px; color: var(--text);">الأسئلة ستظهر هنا...</h2>
      <div id="options-container" class="options-grid"></div>
      <div id="reaction" class="reaction-emoji"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="hidden">
      <h1>🎉 النتيجة النهائية 🎉</h1>
      <div id="final-emoji" style="font-size: 3rem; margin: 15px 0;">🥳❤️</div>
      <p id="score-text" style="font-size: 1.4rem; color: #a7f3d0;"></p>
      <button class="btn" onclick="restartQuiz()" style="margin-top: 20px;">إعادة الاختبار</button>
    </div>

    <!-- الحقوق -->
    <div class="rights">
      تطوير وبواسطة: <strong>المبرمج ضياء</strong> | إعداد المادة: <strong>إيهاب أمجد عبدالحميد</strong>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrectSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function playWrongSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.3);
      });
    }

    const happyEmojis = ["😂", "🥳", "❤️", "😍", "✨", "👏"];
    const sadEmojis = ["🥺", "💔", "😢", "😭", "😿"];

    // الأسئلة الوزارية والدقيقة الخاصة بمنهج العلوم - سادس ابتدائي (الفصل الثالث)
    const questions = [
      { q: "ما هي الوحدة الأساسية لبناء المادة في الطبيعة؟", options: ["الذرة", "الجزيء", "المركب", "العنصر"], answer: 0 },
      { q: "ما هي الجسيمات التي تحمل شحنة موجبة وتوجد داخل نواة الذرة؟", options: ["البروتونات", "النيوترونات", "الإلكترونات", "الفوتونات"], answer: 0 },
      { q: "ما هي الجسيمات ذات الشحنة السالبة والتي تدور حول النواة بسرعة فائقة؟", options: ["البروتونات", "الإلكترونات", "النيوترونات", "النوى"], answer: 1 },
      { q: "ما هي الجسيمات متعادلة الشحنة الكهربائية وتوجد داخل نواة الذرة؟", options: ["الإلكترونات", "النيوترونات", "البروتونات", "الأيونات"], answer: 1 },
      { q: "مادة ناتجة من اتحاد نوع واحد من الذرات تسمى:", options: ["مركباً", "عنصراً", "مخلوطاً", "محلولاً"], answer: 1 },
      { q: "مادة ناتجة من اتحاد ذرات عناصر مختلفة بنسب ثابتة تسمى:", options: ["العنصر", "المركب", "الخليط", "المحلول"], answer: 1 },
      { q: "أي مما يلي يعد مثالاً على مركب كيميائي من كتاب العلوم؟", options: ["الحديد", "الماء", "الأكسجين", "النحاس"], answer: 1 },
      { q: "ما هو الرمز الكيميائي لعنصر الأكسجين؟", options: ["O", "H", "C", "N"], answer: 0 },
      { q: "التغيرات التي تطرأ على المادة ولا تنتج عنها مواد جديدة تسمى:", options: ["التغير الكيميائي", "التغير الفيزيائي", "التفاعل النووي", "التأين"], answer: 1 },
      { q: "تفاعل يتحول فيه مادتان أو أكثر إلى مادة واحدة جديدة يسمى تفاعل:", options: ["الاحتراق", "الاتحاد", "التفكك", "التحلل"], answer: 1 },
      { q: "تفاعل ينتج عنه تفكك مركب إلى مواد أصغر يسمى تفاعل:", options: ["التفكك (التحلل)", "الاتحاد", "الاحتراق", "التكثف"], answer: 0 },
      { q: "تفاعل المادة مع الأكسجين بسرعة وينتج عنه حرارة وضوء يسمى تفاعل:", options: ["الاتحاد", "الاحتراق", "الترشيح", "التبخر"], answer: 1 },
      { q: "أين تتركز كتلة الذرة بصورة رئيسية؟", options: ["في الإلكترونات", "في الغلاف الخارجي", "في النواة", "في المدارات"], answer: 2 },
      { q: "تكون شحنة النواة في الذرة دائماً:", options: ["سالبة", "موجبة", "متعادلة", "عديمة الشحنة"], answer: 1 },
      { q: "أي أجزاء الذرة تعد أصغر حجماً وتتحرك في مدارات حول النواة؟", options: ["البروتونات", "النيوترونات", "الإلكترونات", "النواة"], answer: 2 }
    ];

    let currentQ = 0;
    let score = 0;

    function startQuiz() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQ];
      document.getElementById('question-text').innerText = `السؤال ${currentQ + 1} من ${questions.length}: ${q.q}`;
      document.getElementById('reaction').innerText = '';
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt}</span><span class="btn-icon"></span>`;
        btn.onclick = () => checkAnswer(idx, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, btn) {
      const q = questions[currentQ];
      const buttons = document.querySelectorAll('.option-btn');
      const reactionDiv = document.getElementById('reaction');
      buttons.forEach(b => b.disabled = true);

      if (selected === q.answer) {
        btn.classList.add('correct');
        btn.querySelector('.btn-icon').innerText = '✅';
        const randomHappy = happyEmojis[Math.floor(Math.random() * happyEmojis.length)];
        reactionDiv.innerText = `${randomHappy} إجابة صحيحة! أحسنت يا بطل!`;
        playCorrectSound();
        score++;
      } else {
        btn.classList.add('wrong');
        btn.querySelector('.btn-icon').innerText = '❌';
        buttons[q.answer].classList.add('correct');
        buttons[q.answer].querySelector('.btn-icon').innerText = '✅';
        const randomSad = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
        reactionDiv.innerText = `${randomSad} إجابة خاطئة! حظاً موفقاً بالأسئلة القادمة`;
        playWrongSound();
      }

      setTimeout(() => {
        currentQ++;
        if (currentQ < questions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 1400);
    }

    function showResults() {
      playWinSound();
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      
      const finalEmojiDiv = document.getElementById('final-emoji');
      if (score >= Math.floor(questions.length * 0.8)) {
        finalEmojiDiv.innerText = "🥳🎉❤️✨";
      } else if (score >= Math.floor(questions.length * 0.5)) {
        finalEmojiDiv.innerText = "😀👍❤️";
      } else {
        finalEmojiDiv.innerText = "🥺💔📚";
      }
      
      document.getElementById('score-text').innerText = `لقد حصلت على ${score} من ${questions.length}!`;
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('welcome-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
